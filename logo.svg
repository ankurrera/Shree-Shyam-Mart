<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Cart / Leaf Icon Container -->
  <g transform="translate(15, 15)" filter="url(#subtleShadow)">
    <rect width="90" height="90" rx="22" fill="url(#gradEmerald)" />
    <!-- Modern Shopping Cart with Organic Leaf -->
    <path d="M28 32 L35 32 L46 62 L68 62 L76 42 L39 42" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="72" r="4.5" fill="#FFFFFF"/>
    <circle cx="66" cy="72" r="4.5" fill="#FFFFFF"/>
    <!-- Organic Gold Leaf accent -->
    <path d="M52 26 C62 20 72 24 74 34 C64 36 54 32 52 26 Z" fill="url(#gradGold)" />
    <path d="M52 26 C60 30 68 31 74 34" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="122" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="#111827" letter-spacing="-0.5">
    SHREE <tspan fill="#059669">SHYAM</tspan>
  </text>
  
  <text x="124" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="19" font-weight="700" fill="#D97706" letter-spacing="4">
    MART
  </text>

  <!-- Fast Delivery & Fresh Tagline Pill -->
  <g transform="translate(235, 71)">
    <rect width="170" height="22" rx="11" fill="#ECFDF5" />
    <circle cx="12" cy="11" r="4" fill="#10B981" />
    <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.5">
      100% COD &amp; FRESH
    </text>
  </g>
</svg>
